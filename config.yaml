# Positioning Meter — runtime configuration

universe:
  source_csv: "/Users/sgrelck/Documents/AI workflows/theme_detector/data/universe.csv"
  min_market_cap: 1_500_000_000  # $1.5B
  output_csv: "data/universe.csv"

clusters:
  source_json: "/Users/sgrelck/Documents/AI workflows/theme_detector/data/clusters.json"

backtest:
  start_date: "2016-05-08"  # 10y horizon
  end_date: null  # null => today

storage:
  db_path: "data/positioning.db"
  cache_dir: "data/cache"

providers:
  prices:
    primary: "polygon"      # polygon | yfinance
    fallback: "yfinance"
  options:
    primary: "yahoo_snapshot"  # yahoo_snapshot | polygon
    polygon_enabled: false
  ownership:
    use_edgar: true
    use_openinsider: true
  short_interest:
    source: "finra"
  estimates:
    enabled: false  # overlay only, not in composite

signals:
  history_window_days_slow: 1260   # 5y for positioning, valuation, technical
  history_window_days_fast: 252    # 1y for options
  options_eligibility:
    min_market_cap: 3_000_000_000
    min_avg_contract_volume: 1000
  # V1.18: self-vs-own-history baseline. Ranks today's Temperature (and each
  # bucket) against the SAME name's own trailing distribution, so a structurally
  # cool name (e.g. large-cap semis suppressed by positioning/options) is flagged
  # when it's hot/cold *for itself* even if it never stands out cross-sectionally.
  # Two horizons: 1y headline + 6mo confirmation. Computed on the composite +
  # bucket panels in setup/06; min_periods inside rolling_percentile_rank lets a
  # window populate before it's fully filled.
  # CAVEAT: the options bucket is forward-only (data starts 2026), so the
  # Temperature self-history carries a one-time downward step where options came
  # online; lean on the positioning/technical self-history (clean ~10y) until
  # options accrues a full year. See QUESTIONS.md.
  self_history:
    primary_window_days: 252    # 1y — headline "hot/cold for itself"
    secondary_window_days: 126  # 6mo — shorter horizon confirmation

composite:
  # V1.5: valuation excluded (overlay-only).
  # V1.6 (tools/tune_weights.py grid search): positioning dominates pos vs tech.
  # V1.8: pct_peer changed from cluster-rank to universe-rank.
  # V1.9: bumped options weight (now that signs are correctly inverted —
  #   P/C, skew, term slope, IV rank are all natural "fear" measures, so
  #   their HIGH readings should map to COLD temp, not HOT). Options weight
  #   raised from 0.15 to 0.30 reflecting genuine sentiment value.
  # Backtest empirical optimum for pos vs tech alone is ~0.7/0.3. With
  # options at 0.30, scaling to pos 0.45 + tech 0.25 maintains pos:tech
  # ratio while giving options meaningful weight.
  # Will refine once options accumulates enough history for backtest tuning.
  bucket_weights:
    # V1.15: evidence-tilted. At the 1-month, factor-neutral, non-overlapping
    # horizon (tools/bucket_weight_scan.py), positioning is the only strongly-
    # validated bucket (IC -0.023, t -3.8); technical is weak (t -1.1) but a SMALL
    # weight still adds value (0.50/0.15/0.35 IC -0.0234 beats both 0.40/0.25/0.35
    # at -0.0219 AND dropping technicals at -0.0211 — so keep it, downweighted).
    # Standalone 1m factor-neutral bucket IC (tools/bucket_weight_scan.py):
    # positioning -0.022 (t -3.8), technical -0.011 (t -1.3), options unmeasurable.
    # So positioning is ~2x technical, NOT 4x — weights set ~IC-proportional:
    # pos:tech ~2.5:1, options trimmed from 0.35 to a 0.30 prior (can't validate).
    # In-sample composite IC is a dead heat across nearby splits (all ~-0.023), so
    # this favors evidence-alignment + not over-concentrating over chasing noise.
    positioning: 0.50
    technical: 0.20
    options: 0.30
    flows: 0.00     # placeholder
    valuation: 0.00  # excluded — V1.5
  dual_percentile_weights:
    pct_self: 0.5
    pct_peer: 0.5
  compound_flags:
    late_signal_threshold: 85
    washout_threshold: 15
    divergence_min_technical: 80
    divergence_max_options: 30

etfs:
  sector:
    - XLK
    - SOXX
    - IGV
    - SMH
    - XLC
    - ARKK
    - QQQ
    - IYW
    - VGT
    - FDN
    - SKYY
    - CIBR
    - BOTZ
    - ROBO
  single_stock_leveraged:
    - TSLL
    - NVDL
    - MSFU
    - AMZU
    - GGLL
    - METU

logging:
  level: "INFO"
  log_dir: "logs"

rate_limits:
  yfinance_sleep_sec: 0.5
  edgar_req_per_sec: 8  # SEC limit is 10/sec, stay under
  polygon_req_per_min: 100
